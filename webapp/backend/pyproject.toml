[project]
name = "mmai-web"
version = "0.1.0"
description = "Flask services, MCP server, and web backend wrapping the matchminer-ai package"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matchminer-ai",
  "torch>=2.11.0",
  "flask>=3.1",
  "flask-cors>=5.0",
  "mcp>=2.3,<3",
  "uvicorn>=0.34",
  "asgiref>=3.8",
  "openai>=2.8.0",
  "requests>=2.32",
  "python-dotenv>=1.1",
]

[project.scripts]
mmai-web = "mmai_web.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmai_web"]

[tool.uv.sources]
# The package in this repository, used as-is (never modified by the web app).
matchminer-ai = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
